<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Numbered - Notetaking</title>
<style>
  :root {
    --paper: #FAF9FC;
    --paper-raised: #F1EEF5;
    --ink: #120D16;
    --ink-soft: #5C5266;
    --ink-faint: #8B8093;
    --line: #E2DCE6;
    --accent: #4B2E68;
    --accent-contrast: #FFFFFF;
    --accent-tint: #ECE5F0;
    --new-link: #8D7B9C;
    --new-link-tint: #F1EAF5;
    --danger: #120D16;
    --danger-tint: #ECE9ED;
    --font-serif: ui-serif, Georgia, "Iowan Old Style", "Palatino Linotype", "Book Antiqua", serif;
    --font-sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    color-scheme: light;
  }
  [data-theme="dark"] {
    --paper: #0B090D;
    --paper-raised: #17131C;
    --ink: #F1EEF5;
    --ink-soft: #A99DB8;
    --ink-faint: #726A80;
    --line: #2B2433;
    --accent: #A98FD1;
    --accent-contrast: #140E1B;
    --accent-tint: #241C2E;
    --new-link: #7A6B8C;
    --new-link-tint: #221D29;
    --danger: #F1EEF5;
    --danger-tint: #201C24;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: var(--font-sans);
    background: var(--paper);
    color: var(--ink);
    font-size: 14px;
    line-height: 1.5;
  }
  button, input, textarea, select {
    font-family: inherit;
    color: inherit;
  }
  button { cursor: pointer; background: none; border: none; }
  button:disabled { cursor: not-allowed; }
  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .app { height: 100vh; display: flex; flex-direction: column; }

  /* ---------- Header ---------- */
  .topbar {
    height: 48px; flex: 0 0 auto;
    display: flex; align-items: center; gap: 8px;
    padding: 0 12px; border-bottom: 1px solid var(--line);
    background: var(--paper-raised);
  }
  .hamburger { display: none; width: 32px; height: 32px; align-items: center; justify-content: center; border-radius: 6px; }
  .hamburger:hover { background: var(--accent-tint); }
  .hamburger svg { width: 18px; height: 18px; stroke: var(--ink); }
  .wordmark { font-family: var(--font-serif); font-size: 17px; letter-spacing: 0.2px; white-space: nowrap; }
  .topbar-spacer { flex: 1; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 12px; border-radius: 6px; font-size: 13px;
    border: 1px solid var(--line); background: var(--paper-raised); white-space: nowrap;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-contrast); }
  .btn-primary:hover { color: var(--accent-contrast); opacity: 0.9; }
  .btn-danger:hover { border-color: var(--ink); color: var(--ink); }
  .btn-icon {
    width: 30px; height: 30px; padding: 0;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 6px; border: 1px solid var(--line); background: var(--paper-raised);
  }
  .btn-icon:hover { border-color: var(--accent); }
  .btn-icon svg { width: 15px; height: 15px; stroke: var(--ink); }
  .btn-icon.active { background: var(--accent); border-color: var(--accent); }
  .btn-icon.active svg { stroke: var(--accent-contrast); }
  .btn-icon:disabled { opacity: 0.32; }
  .btn-icon:disabled:hover { border-color: var(--line); }

  /* ---------- Layout ---------- */
  .layout { flex: 1 1 auto; display: flex; min-height: 0; }
  .backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 20; }
  .backdrop.open { display: block; }

  .sidebar {
    width: 270px; flex: 0 0 auto; border-right: 1px solid var(--line);
    display: flex; flex-direction: column; min-height: 0; background: var(--paper);
  }
  .sidebar-search { padding: 10px; border-bottom: 1px solid var(--line); }
  .breadcrumb { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; font-size: 12px; color: var(--ink-faint); margin-bottom: 8px; }
  .crumb { background: none; border: none; padding: 2px 3px; border-radius: 4px; color: var(--ink-soft); font-size: 12px; cursor: pointer; }
  .crumb:hover { background: var(--accent-tint); color: var(--accent); }
  .crumb-sep { color: var(--ink-faint); padding: 0 1px; }
  .crumb-current { padding: 2px 3px; color: var(--ink); font-weight: 600; }
  .crumb-action { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 4px; margin-left: 2px; vertical-align: middle; }
  .crumb-action:hover { background: var(--accent-tint); }
  .crumb-action svg, .row-icon { width: 13px; height: 13px; stroke: var(--ink-faint); flex: 0 0 auto; align-self: center; }
  .search-row { display: flex; gap: 6px; }
  .search-row input {
    flex: 1 1 auto; padding: 7px 10px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--paper-raised); font-size: 13px;
  }
  .content-search-row { display: flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 12px; color: var(--ink-soft); }
  .note-list { list-style: none; margin: 0; padding: 4px 0; overflow-y: auto; flex: 1 1 auto; }
  .note-list li { display: flex; align-items: baseline; gap: 8px; padding: 8px 12px 8px 10px; border-left: 3px solid transparent; cursor: pointer; }
  .note-list li:hover { background: var(--accent-tint); }
  .note-list li.active { border-left-color: var(--accent); background: var(--accent-tint); }
  .note-list li.folder-row { font-weight: 600; }
  .note-list .file-id { font-family: var(--font-mono); font-size: 11px; color: var(--ink-faint); flex: 0 0 auto; }
  .note-list .note-title { font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1 1 auto; }
  .note-loc { font-size: 10.5px; color: var(--ink-faint); font-weight: 400; margin-left: 4px; }
  .empty-hint { padding: 16px 14px; color: var(--ink-faint); font-size: 13px; }
  .sidebar-footer { border-top: 1px solid var(--line); padding: 8px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .note-count { font-size: 11.5px; color: var(--ink-faint); width: 100%; padding: 0 2px 2px; }

  /* ---------- Editor pane ---------- */
  .editor-pane { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .note-toolbar { display: flex; align-items: center; gap: 8px; padding: 8px 18px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .file-badge { font-family: var(--font-mono); font-size: 12px; color: var(--ink-faint); background: var(--paper-raised); border: 1px solid var(--line); border-radius: 5px; padding: 3px 7px; white-space: nowrap; }
  .status-text { font-size: 12px; color: var(--ink-faint); flex: 1 1 auto; min-width: 40px; }
  .mode-toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .mode-toggle button { padding: 5px 12px; font-size: 12.5px; background: var(--paper-raised); }
  .mode-toggle button.active { background: var(--accent); color: var(--accent-contrast); }
  .note-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 20px 26px 0; display: flex; flex-direction: column; }
  .title-input { font-family: var(--font-serif); font-size: 25px; border: none; background: transparent; width: 100%; padding: 2px 0; }
  .title-input::placeholder { color: var(--ink-faint); }
  .tags-row { display: flex; align-items: center; gap: 8px; margin: 4px 0 14px; }
  .tags-row label { font-size: 11.5px; color: var(--ink-faint); }
  .tags-input { flex: 1 1 auto; border: none; background: transparent; font-size: 12.5px; color: var(--ink-soft); padding: 3px 0; border-bottom: 1px dashed transparent; }
  .tags-input:focus { border-bottom-color: var(--line); }
  .divider { border-top: 1px solid var(--line); margin: 0 0 14px; }
  .content-textarea { flex: 1 1 auto; width: 100%; min-height: 220px; border: none; background: transparent; resize: none; font-size: 15.5px; line-height: 1.65; font-family: var(--font-sans); }
  .preview { flex: 1 1 auto; min-height: 220px; font-size: 15.5px; line-height: 1.7; max-width: 72ch; }
  .preview h1, .preview h2, .preview h3 { font-family: var(--font-serif); line-height: 1.3; }
  .preview h1 { font-size: 25px; }
  .preview h2 { font-size: 20px; }
  .preview h3 { font-size: 17px; }
  .preview p { margin: 0 0 12px; }
  .preview code { font-family: var(--font-mono); background: var(--accent-tint); padding: 1px 5px; border-radius: 4px; font-size: 0.9em; }
  .preview pre { background: var(--paper-raised); border: 1px solid var(--line); border-radius: 6px; padding: 12px; overflow-x: auto; }
  .preview pre code { background: none; padding: 0; }
  .preview blockquote { margin: 0 0 12px; padding-left: 14px; border-left: 3px solid var(--line); color: var(--ink-soft); }
  .preview ul, .preview ol { padding-left: 22px; margin: 0 0 12px; }
  a.wikilink { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--accent); }
  a.wikilink:hover { opacity: 0.75; }
  a.wikilink-new { color: var(--new-link); text-decoration: none; border-bottom: 1px dashed var(--new-link); }
  a.wikilink-new:hover { opacity: 0.75; }

  .backlinks { flex: 0 0 auto; border-top: 1px solid var(--line); margin-top: 18px; padding: 12px 0 22px; }
  .backlinks h4 { margin: 0 0 8px; font-size: 12px; color: var(--ink-faint); font-weight: 600; }
  .backlinks ul { list-style: none; margin: 0; padding: 0; }
  .backlinks li { margin-bottom: 4px; }
  .backlinks a { text-decoration: none; font-size: 13.5px; display: inline-flex; gap: 6px; align-items: baseline; }
  .backlinks .file-id { font-size: 10.5px; color: var(--ink-faint); font-family: var(--font-mono); }
  .muted { color: var(--ink-faint); font-size: 13px; }

  .empty-state { flex: 1 1 auto; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 14px; color: var(--ink-soft); padding: 40px; text-align: center; }
  .empty-state h2 { font-family: var(--font-serif); font-weight: 500; font-size: 19px; margin: 0; }

  /* ---------- Graph view ---------- */
  .graph-view { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }
  .graph-toolbar { padding: 9px 16px; border-bottom: 1px solid var(--line); flex: 0 0 auto; }
  .graph-toolbar-row1 { margin-bottom: 4px; }
  .graph-toolbar-row2 { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .graph-name-label { font-size: 13px; color: var(--ink-soft); display: flex; align-items: center; gap: 2px; }
  .graph-scope-select { font-size: 12.5px; padding: 5px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--paper-raised); color: var(--ink); }
  #graphSvg { flex: 1 1 auto; width: 100%; height: 100%; display: block; cursor: grab; }
  #graphSvg:active { cursor: grabbing; }
  .graph-view text { font-family: var(--font-sans); font-size: 10.5px; fill: var(--ink-soft); pointer-events: none; user-select: none; }
  .graph-node-real { fill: var(--accent); stroke: var(--paper); stroke-width: 1.5px; cursor: pointer; }
  .graph-node-phantom { fill: var(--paper-raised); stroke: var(--new-link); stroke-width: 1.5px; stroke-dasharray: 3,2; cursor: pointer; }
  .graph-node-folder { fill: var(--accent); stroke: var(--paper); stroke-width: 1.5px; cursor: pointer; }
  .graph-link { stroke: var(--line); stroke-width: 1.2px; }
  .graph-link-phantom { stroke-dasharray: 3,3; }
  .graph-empty-text { font-size: 13px; fill: var(--ink-faint); }

  /* ---------- Modal ---------- */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); align-items: flex-start; justify-content: center; padding-top: 10vh; z-index: 50; }
  .modal-overlay.open { display: flex; }
  .modal-box { background: var(--paper-raised); border-radius: 8px; border: 1px solid var(--line); width: min(460px, 92vw); max-height: 76vh; overflow-y: auto; padding: 16px; box-shadow: 0 12px 32px rgba(0,0,0,0.28); }
  .modal-box h3 { margin: 0 0 8px; font-family: var(--font-serif); font-weight: 500; font-size: 18px; }
  .modal-box p { margin: 0 0 14px; font-size: 13.5px; color: var(--ink-soft); }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }
  .picker-input { width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--paper); font-size: 14px; margin-bottom: 8px; }
  .picker-list { list-style: none; margin: 0; padding: 0; max-height: 240px; overflow-y: auto; }
  .picker-list li { padding: 7px 8px; border-radius: 6px; cursor: pointer; font-size: 13.5px; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .picker-list li:hover, .picker-list li.picker-active { background: var(--accent-tint); }
  .picker-list .file-id { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-faint); }
  .picker-hint { font-size: 12px; color: var(--ink-faint); margin-top: 8px; }
  .bible-view { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }
  .bible-toolbar-main { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .bible-toolbar-jump { display: flex; align-items: center; gap: 8px; padding: 8px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .bible-toolbar-jump .picker-input { flex: 1 1 200px; margin-bottom: 0; }
  .bible-select { padding: 7px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--paper-raised); font-size: 13px; color: var(--ink); }
  .bible-reader { flex: 1 1 auto; overflow-y: auto; padding: 20px 26px 40px; max-width: 72ch; }
  .bible-chapter-heading { font-family: var(--font-serif); font-weight: 500; font-size: 20px; margin: 0 0 16px; }
  .bible-section-heading { font-family: var(--font-serif); font-weight: 600; font-size: 15px; margin: 14px 0 8px; }
  .bible-copyright { margin-top: 18px; font-size: 11px; }
  .bible-verse { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 10px; font-family: var(--font-serif); font-size: 15.5px; line-height: 1.7; }
  .verse-num { font-family: var(--font-sans); font-size: 11px; color: var(--ink-faint); flex: 0 0 auto; margin-top: 4px; min-width: 20px; text-align: right; }
  .verse-text { flex: 1 1 auto; }
  .verse-insert { flex: 0 0 auto; width: 22px; height: 22px; border-radius: 5px; display: inline-flex; align-items: center; justify-content: center; opacity: 0.35; margin-top: 2px; }
  .verse-insert:hover { opacity: 1; background: var(--accent-tint); }
  .verse-insert svg { width: 12px; height: 12px; stroke: var(--ink-faint); }

  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%) translateY(8px); background: var(--ink); color: var(--paper); padding: 8px 16px; border-radius: 6px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity 0.2s ease, transform 0.2s ease; z-index: 60; max-width: 88vw; text-align: center; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  input[type="file"] { display: none; }

  @media (max-width: 860px) {
    .hamburger { display: inline-flex; }
    .sidebar { position: fixed; top: 48px; bottom: 0; left: 0; width: 84vw; max-width: 320px; transform: translateX(-100%); transition: transform 0.18s ease; z-index: 21; box-shadow: 2px 0 16px rgba(0,0,0,0.25); }
    .sidebar.open { transform: translateX(0); }
    .note-body { padding: 16px 16px 0; }
    .note-toolbar { padding: 8px 12px; }
  }
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <button class="hamburger" id="hamburgerBtn" aria-label="Toggle note list">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <span class="wordmark">Numbered</span>
    <div class="topbar-spacer"></div>
    <button class="btn-icon" id="bibleToggleBtn" aria-label="Bible" title="Bible">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6c-2-1.5-5-2-8-1v13c3-1 6-0.5 8 1c2-1.5 5-2 8-1V5c-3-1-6-0.5-8 1z"/><path d="M12 6v13"/></svg>
    </button>
    <button class="btn-icon" id="graphToggleBtn" aria-label="Toggle graph view" title="Graph view">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="7" r="2.2"/><circle cx="18" cy="7" r="2.2"/><circle cx="12" cy="18" r="2.2"/><path d="M8.1 8.1L11 16M15.9 8.1L13 16M8.3 6.4H15.7"/></svg>
    </button>
    <button class="btn btn-primary" id="newNoteBtn">+ New</button>
  </div>

  <div class="backdrop" id="backdrop"></div>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-search">
        <div class="breadcrumb" id="sidebarBreadcrumb"></div>
        <div class="search-row">
          <input type="text" id="searchInput" placeholder="Search titles &amp; tags" autocomplete="off" />
          <button class="btn-icon" id="newFolderBtn" aria-label="New folder" title="New folder">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"/><path d="M12 11v4M10 13h4"/></svg>
          </button>
        </div>
        <div class="content-search-row">
          <label style="display:flex;align-items:center;gap:5px;">
            <input type="checkbox" id="deepSearchToggle" />
            also search note text
          </label>
        </div>
      </div>
      <ul class="note-list" id="noteList"></ul>
      <div class="sidebar-footer">
        <div class="note-count" id="noteCount"></div>
        <button class="btn" id="importBtn">Import .md</button>
        <button class="btn" id="exportBtn">Export vault</button>
        <button class="btn-icon" id="themeToggle" aria-label="Toggle dark mode">
          <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
        </button>
        <input type="file" id="importInput" multiple accept=".md,.markdown,text/markdown,text/plain" />
      </div>
    </aside>

    <main class="editor-pane" id="editorPane"></main>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box" id="modalBox"></div>
</div>

<div class="toast" id="toast"></div>

<template id="editorTemplate">
  <div class="note-toolbar">
    <span class="file-badge" id="fileBadge">note.md</span>
    <span class="status-text" id="statusText"></span>
    <div class="mode-toggle">
      <button id="writeTab" class="active">Write</button>
      <button id="readTab">Read</button>
    </div>
    <button class="btn-icon" id="moveFolderBtn" aria-label="Move to folder" title="Move to folder">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"/></svg>
    </button>
    <button class="btn-icon" id="manageGraphsBtn" aria-label="Add to graph" title="Add to graph">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="7" r="2"/><circle cx="18" cy="7" r="2"/><circle cx="12" cy="18" r="2"/><path d="M8 8L11 16M16 8L13 16M8.3 6.4H15.7"/></svg>
    </button>
    <button class="btn-icon" id="downloadNoteBtn" aria-label="Download this note" title="Download this note">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 21h16"/></svg>
    </button>
    <button class="btn-icon" id="deleteNoteBtn" aria-label="Delete this note" title="Delete this note">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3m-8 0l1 13h8l1-13"/></svg>
    </button>
  </div>
  <div class="note-body">
    <input type="text" id="titleInput" class="title-input" placeholder="Untitled" autocomplete="off" />
    <div class="tags-row">
      <label for="tagsInput">tags</label>
      <input type="text" id="tagsInput" class="tags-input" placeholder="comma, separated, tags" autocomplete="off" />
    </div>
    <div class="divider"></div>
    <textarea id="contentTextarea" class="content-textarea" placeholder="Start writing. Type [[ to link another note."></textarea>
    <div class="preview" id="preview" style="display:none;"></div>
    <div class="backlinks" id="backlinks"></div>
  </div>
</template>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script>
(function(){
  "use strict";

  /* ============ IndexedDB storage layer ============ */
  var DB_NAME = 'numbered-db';
  var DB_VERSION = 1;
  var STORE = 'kv';
  var dbPromise = null;
  function openDB(){
    if(dbPromise) return dbPromise;
    dbPromise = new Promise(function(resolve, reject){
      if(!('indexedDB' in window)){ reject(new Error('no indexeddb')); return; }
      var req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = function(){
        var db = req.result;
        if(!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE);
      };
      req.onsuccess = function(){ resolve(req.result); };
      req.onerror = function(){ reject(req.error); };
    });
    return dbPromise;
  }
  function idbGet(key){
    return openDB().then(function(db){
      return new Promise(function(resolve, reject){
        var tx = db.transaction(STORE, 'readonly');
        var req = tx.objectStore(STORE).get(key);
        req.onsuccess = function(){ resolve(req.result === undefined ? null : req.result); };
        req.onerror = function(){ reject(req.error); };
      });
    });
  }
  function idbSet(key, value){
    return openDB().then(function(db){
      return new Promise(function(resolve, reject){
        var tx = db.transaction(STORE, 'readwrite');
        tx.objectStore(STORE).put(value, key);
        tx.oncomplete = function(){ resolve(true); };
        tx.onerror = function(){ reject(tx.error); };
      });
    });
  }
  function idbDelete(key){
    return openDB().then(function(db){
      return new Promise(function(resolve, reject){
        var tx = db.transaction(STORE, 'readwrite');
        tx.objectStore(STORE).delete(key);
        tx.oncomplete = function(){ resolve(true); };
        tx.onerror = function(){ reject(tx.error); };
      });
    });
  }

  /* ============ utilities ============ */
  function pad(n){ return String(n).padStart(4,'0'); }
  function nextSeq(list, prefix){

  function escapeHtml(s){

  function debounce(fn, ms){

    wrapped.flush = function(){ clearTimeout(t); t = null; };

  function downloadBlob(content, filename, mime){

      if(m < 1) return 'just now';
      if(m < 60) return m+'m ago';
      var h = Math.floor(m/60);
      if(h < 24) return h+'h ago';
      var d = Math.floor(h/24);

    } catch(e){ return ''; }

  function confirmDeleteFolder(id){

    showModal(

  async function deleteFolder(id){
    var f = FOLDERS.find(function(x){ return x.id===id; });
    if(!f) return;
    var parentId = f.parentId;
    FOLDERS.forEach(function(x){ if(x.parentId===id) x.parentId = parentId; });
    FOLDERS = FOLDERS.filter(function(x){ return x.id !== id; });
    var affectedIds = INDEX.filter(function(e){ return e.folderId===id; }).map(function(e){return e.id;});
    for(var i=0;i<affectedIds.length;i++){
      var nid = affectedIds[i];
      var n = CACHE.get(nid);
      if(!n){ n = await getNoteById(nid); if(n) CACHE.set(nid,n); }
      if(n){ n.folderId = parentId; await setNoteRaw(n); }
      var entry = INDEX.find(function(e){ return e.id===nid; });
      if(entry) entry.folderId = parentId;

    await setIndex(INDEX);

  function wireEditorEvents(){
    dom.writeTab.addEventListener('click', function(){ setMode('write'); });
    dom.readTab.addEventListener('click', function(){ setMode('read'); });
    dom.moveFolderBtn.addEventListener('click', openMoveFolderPicker);
    dom.manageGraphsBtn.addEventListener('click', openGraphMembershipPicker);
    dom.downloadNoteBtn.addEventListener('click', exportCurrent);
    dom.deleteNoteBtn.addEventListener('click', confirmDeleteCurrent);

    dom.titleInput.addEventListener('input', function(){ scheduleSave(); });
    dom.titleInput.addEventListener('blur', onTitleBlur);
    dom.tagsInput.addEventListener('input', function(){ scheduleSave(); });
    dom.contentTextarea.addEventListener('input', function(){
      handleWikiTriggerCheck();
      scheduleSave();
    });
    dom.contentTextarea.addEventListener('keydown', function(e){
      if(e.key === 'Escape' && wikiTrigger){ hideModal(); }
    });
  }

  function setMode(mode){
    MODE = mode;
    dom.writeTab.classList.toggle('active', mode==='write');
    dom.readTab.classList.toggle('active', mode==='read');
    dom.contentTextarea.style.display = (mode==='write') ? '' : 'none';
    dom.preview.style.display = (mode==='read') ? '' : 'none';
    if(mode === 'read') renderPreview();
  }

  function renderPreview(){
    var md = dom.contentTextarea.value;
    var transformed = transformWikilinks(md);
    var html = (typeof marked !== 'undefined')
      ? (marked.parse ? marked.parse(transformed) : marked(transformed))
      : escapeHtml(transformed).replace(/\n/g,'<br>');
    dom.preview.innerHTML = html;
    dom.preview.querySelectorAll('a[href^="#wikilink:"]').forEach(function(a){
      var title = decodeURIComponent(a.getAttribute('href').slice('#wikilink:'.length));
      var isNew = a.getAttribute('title') === 'new';
      a.classList.add(isNew ? 'wikilink-new' : 'wikilink');
      a.removeAttribute('title');
      a.setAttribute('href', 'javascript:void(0)');
      a.addEventListener('click', function(e){ e.preventDefault(); openOrCreateByTitle(title); });
    });
  }

  function transformWikilinks(md){
    var titleMap = new Map(INDEX.map(function(e){ return [e.title.toLowerCase(), e]; }));
    return md.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, function(m, rawTitle, alias){
      var title = rawTitle.trim();
      var label = (alias || title).trim();
      var exists = titleMap.has(title.toLowerCase());
      return '['+label+'](#wikilink:'+encodeURIComponent(title)+' "'+(exists?'existing':'new')+'")';
    });
  }

  /* ============ open / switch notes ============ */
  function exitSpecialViewIfNeeded(){
    if(VIEW === 'graph'){
      VIEW = 'notes';
      graphToggleBtn.classList.remove('active');
      stopGraphSim();
    } else if(VIEW === 'bible'){
      VIEW = 'notes';
      bibleToggleBtn.classList.remove('active');
    }
  }

  async function openNote(id){
    exitSpecialViewIfNeeded();
    var n = CACHE.get(id);
    if(!n){ n = await getNoteById(id); if(n) CACHE.set(id, n); }
    if(!n){ CURRENT_ID = null; mountEmptyState(); return; }
    CURRENT_ID = id;
    CURRENT_FOLDER = n.folderId || null;
    titleAtOpen = n.title || '';
    mountEditor();
    var fname = fileNameFor(n);
    dom.fileBadge.textContent = fname || 'No title yet \u2014 add one to enable download';
    dom.downloadNoteBtn.disabled = !fname;
    dom.titleInput.value = n.title || '';
    dom.tagsInput.value = (n.tags||[]).join(', ');
    dom.contentTextarea.value = n.content || '';
    dom.statusText.textContent = 'Saved ' + relTime(n.updatedAt);
    setMode('write');
    renderBacklinks(n);
    renderSidebar();
  }

  async function switchNote(id){
    flushSave();
    await openNote(id);
  }

  async function openOrCreateByTitle(title){
    flushSave();
    var existing = INDEX.find(function(e){ return e.title.toLowerCase() === title.toLowerCase(); });
    if(existing){ await openNote(existing.id); }
    else { await createNoteWithTitle(title); }
  }

  /* ============ saving ============ */
  function flushSave(){
    scheduleSave.cancel();
    if(CURRENT_ID) saveNoteFields();
  }

  async function saveNoteFields(){
    if(!CURRENT_ID) return;
    var n = CACHE.get(CURRENT_ID);
    if(!n) return;
    dom.statusText.textContent = 'Saving\u2026';
    n.title = dom.titleInput.value.trim();
    n.tags = dom.tagsInput.value.split(',').map(function(t){ return t.trim(); }).filter(Boolean);
    n.content = dom.contentTextarea.value;
    n.updatedAt = new Date().toISOString();
    await setNoteRaw(n);
    CACHE.set(n.id, n);
    var idxEntry = INDEX.find(function(e){ return e.id === n.id; });
    if(idxEntry){
      idxEntry.title = n.title; idxEntry.tags = n.tags; idxEntry.updatedAt = n.updatedAt;
    }
    await setIndex(INDEX);
    broadcastChange();
    var fname = fileNameFor(n);
    dom.fileBadge.textContent = fname || 'No title yet \u2014 add one to enable download';
    dom.downloadNoteBtn.disabled = !fname;
    dom.statusText.textContent = 'Saved ' + relTime(n.updatedAt);
    renderSidebar();
    if(MODE === 'read') renderPreview();
  }

  async function onTitleBlur(){
    if(!CURRENT_ID) return;
    var newTitle = dom.titleInput.value.trim();
    if(newTitle && newTitle !== titleAtOpen){
      await cascadeRenameLinks(titleAtOpen, newTitle);
      titleAtOpen = newTitle;
    } else if(!newTitle){
      titleAtOpen = '';
    }
    var n = CACHE.get(CURRENT_ID);
    if(n){
      var fname = fileNameFor(n);
      dom.fileBadge.textContent = fname || 'No title yet \u2014 add one to enable download';
      dom.downloadNoteBtn.disabled = !fname;
      renderBacklinks(n);
    }
  }

  async function cascadeRenameLinks(oldTitle, newTitle){
    if(!oldTitle || oldTitle === newTitle) return;
    await ensureAllLoaded();
    var pattern = new RegExp('\\[\\[\\s*'+escapeRegex(oldTitle)+'\\s*\\]\\]','g');
    var changedAny = false;
    for(var i=0;i<INDEX.length;i++){
      var entry = INDEX[i];
      if(entry.id === CURRENT_ID) continue;
      var n = CACHE.get(entry.id);
      if(n && n.content && pattern.test(n.content)){
        pattern.lastIndex = 0;
        n.content = n.content.replace(pattern, '[['+newTitle+']]');
        n.updatedAt = new Date().toISOString();
        await setNoteRaw(n);
        entry.updatedAt = n.updatedAt;
        changedAny = true;
      }
    }
    if(changedAny){ await setIndex(INDEX); broadcastChange(); renderSidebar(); }
  }

  /* ============ backlinks ============ */
  async function renderBacklinks(note){
    dom.backlinks.innerHTML = '<p class="muted">Finding links\u2026</p>';
    await ensureAllLoaded();
    if(!note.title){ dom.backlinks.innerHTML = '<h4>Linked from</h4><p class="muted">Give this note a title so others can link to it.</p>'; return; }
    var pattern = new RegExp('\\[\\[\\s*'+escapeRegex(note.title)+'(\\s*\\|[^\\]]*)?\\s*\\]\\]','i');
    var refs = INDEX.filter(function(e){
      if(e.id === note.id) return false;
      var n = CACHE.get(e.id);
      return n && n.content && pattern.test(n.content);
    });
    if(!refs.length){
      dom.backlinks.innerHTML = '<h4>Linked from</h4><p class="muted">Nothing links here yet.</p>';
      return;
    }
    dom.backlinks.innerHTML = '<h4>Linked from</h4><ul>'+refs.map(function(r){
      return '<li><a href="javascript:void(0)" data-id="'+r.id+'">'+escapeHtml(r.title)+' <span class="file-id">'+r.id+'</span></a></li>';
    }).join('')+'</ul>';
    dom.backlinks.querySelectorAll('a[data-id]').forEach(function(a){
      a.addEventListener('click', function(){ switchNote(a.getAttribute('data-id')); closeDrawer(); });
    });
  }

  /* ============ create / delete note ============ */
  async function createNoteWithTitle(title){
    flushSave();
    var id = nextSeq(INDEX, '');
    var now = new Date().toISOString();
    var note = { id:id, title: title || '', folderId: CURRENT_FOLDER, graphIds: [], tags: [], content: '', createdAt: now, updatedAt: now };
    await setNoteRaw(note);
    CACHE.set(id, note);
    INDEX.push(toIndexEntry(note));
    await setIndex(INDEX);
    broadcastChange();
    await openNote(id);
    closeDrawer();
    dom.titleInput.focus();
    dom.titleInput.select();
    return id;
  }
  newNoteBtn.addEventListener('click', function(){ createNoteWithTitle(''); });

  function confirmDeleteCurrent(){
    var n = CACHE.get(CURRENT_ID);
    if(!n) return;
    var fname = fileNameFor(n) || '(untitled note)';
    showModal(
      '<h3>Delete "'+escapeHtml(n.title||'(untitled)')+'"?</h3>'+
      '<p>This removes '+escapeHtml(fname)+'. Links to it from other notes will stay as text and turn into "create new" links.</p>'+
      '<div class="modal-actions">'+
      '<button class="btn" id="cancelDeleteBtn">Cancel</button>'+
      '<button class="btn btn-danger" id="confirmDeleteBtn">Delete</button>'+
      '</div>'
    );
    document.getElementById('cancelDeleteBtn').addEventListener('click', hideModal);
    document.getElementById('confirmDeleteBtn').addEventListener('click', async function(){
      await deleteNote(n.id);
      hideModal();
    });
  }

  async function deleteNote(id){
    scheduleSave.cancel();
    await deleteNoteStorage(id);
    CACHE.delete(id);
    INDEX = INDEX.filter(function(e){ return e.id !== id; });
    await setIndex(INDEX);
    broadcastChange();
    if(CURRENT_ID === id){
      CURRENT_ID = null;
      var sameFolder = INDEX.filter(function(e){ return e.folderId === CURRENT_FOLDER; });
      var sorted = sameFolder.slice().sort(function(a,b){ return new Date(b.updatedAt) - new Date(a.updatedAt); });
      if(sorted[0]) await openNote(sorted[0].id);
      else mountEmptyState();
    }
    renderSidebar();
    toast('Note deleted');
  }

  /* ============ wikilink autocomplete ============ */
  function handleWikiTriggerCheck(){
    var ta = dom.contentTextarea;
    var pos = ta.selectionStart;
    var text = ta.value;
    var twoBefore = text.slice(Math.max(0,pos-2), pos);

    if(wikiTrigger === null){
      if(twoBefore === '[['){
        wikiTrigger = { start: pos };
        openLinkPicker('');
      }
      return;
    }
    if(pos < wikiTrigger.start){ wikiTrigger = null; hideModal(); return; }
    var query = text.slice(wikiTrigger.start, pos);
    if(query.indexOf(']') !== -1 || query.indexOf('\n') !== -1){
      wikiTrigger = null; hideModal(); return;
    }
    updatePickerFilter(query);
  }

  function openLinkPicker(initialQuery){
    showModal(
      '<input type="text" class="picker-input" id="linkPickerInput" placeholder="Search or type a new title\u2026" autocomplete="off" />'+
      '<ul class="picker-list" id="linkPickerList"></ul>'+
      '<p class="picker-hint">Press Enter to create a note with that title if none match.</p>'
    );
    var input = document.getElementById('linkPickerInput');
    input.value = initialQuery || '';
    renderPickerList(initialQuery || '');
    input.addEventListener('input', function(){ renderPickerList(input.value); });
    input.addEventListener('keydown', function(e){
      if(e.key === 'Enter'){
        e.preventDefault();
        var list = document.getElementById('linkPickerList');
        var active = list.querySelector('.picker-active');
        if(active){ chooseLinkTarget(active.getAttribute('data-title')); }
        else { chooseLinkTarget(input.value.trim() || 'Untitled'); }
      }
    });
    setTimeout(function(){ input.focus(); }, 0);
  }

  function updatePickerFilter(query){
    var input = document.getElementById('linkPickerInput');
    if(!input) return;
    input.value = query;
    renderPickerList(query);
  }

  function renderPickerList(query){
    var list = document.getElementById('linkPickerList');
    if(!list) return;
    var q = (query||'').toLowerCase();
    var matches = INDEX.filter(function(e){ return e.title.toLowerCase().indexOf(q) !== -1; })
      .sort(function(a,b){ return new Date(b.updatedAt) - new Date(a.updatedAt); })
      .slice(0, 30);
    var html = matches.map(function(e, i){
      return '<li data-title="'+escapeHtml(e.title)+'" class="'+(i===0?'picker-active':'')+'">'+
        '<span>'+escapeHtml(e.title)+'</span><span class="file-id">'+e.id+'</span></li>';
    }).join('');
    if(q && !matches.some(function(e){ return e.title.toLowerCase() === q; })){
      html += '<li data-title="'+escapeHtml(query)+'" class="'+(matches.length===0?'picker-active':'')+'">'+
        '<span>Create \u201c'+escapeHtml(query)+'\u201d</span><span class="file-id">new</span></li>';
    }
    list.innerHTML = html || '<li class="muted" style="cursor:default;">Type to search or create\u2026</li>';
    list.querySelectorAll('li[data-title]').forEach(function(li){
      li.addEventListener('click', function(){ chooseLinkTarget(li.getAttribute('data-title')); });
    });
  }

  function chooseLinkTarget(title){
    title = (title||'').trim();
    if(!title || !wikiTrigger){ hideModal(); return; }
    var ta = dom.contentTextarea;
    var text = ta.value;
    var before = text.slice(0, wikiTrigger.start);
    var after = text.slice(ta.selectionStart);
    var inserted = title + ']]';
    ta.value = before + inserted + after;
    var caret = (before+inserted).length;
    ta.setSelectionRange(caret, caret);
    wikiTrigger = null;
    hideModal();
    ta.focus();
    scheduleSave();
  }

  /* ============ export / import ============ */
  async function exportCurrent(){
    flushSave();
    var n = CACHE.get(CURRENT_ID);
    if(!n) return;
    var fname = fileNameFor(n);
    if(!fname){ toast('Add a title before downloading this note.'); return; }
    downloadBlob(fileContentFor(n), fname, 'text/markdown');
    toast('Downloaded ' + fname);
  }

  exportBtn.addEventListener('click', async function(){
    flushSave();
    if(typeof JSZip === 'undefined'){ toast('Export needs the page to be online to load its zip tool.'); return; }
    await ensureAllLoaded();
    var zip = new JSZip();
    var used = new Set();
    var included = 0, skipped = 0;
    INDEX.forEach(function(e){
      var n = CACHE.get(e.id);
      if(!n) return;
      var fname = fileNameFor(n);
      if(!fname){ skipped++; return; }
      var base = fname, i = 2;
      while(used.has(fname)){ fname = base.replace(/\.md$/,'') + ' ('+i+').md'; i++; }
      used.add(fname);
      zip.file(fname, fileContentFor(n));
      included++;
    });
    if(!included){ toast('Nothing to export \u2014 give at least one note a title.'); return; }
    toast('Zipping ' + included + ' notes\u2026');
    var blob = await zip.generateAsync({type:'blob'});
    downloadBlob(blob, 'numbered-export-'+dateStamp()+'.zip');
    toast('Exported ' + included + (skipped ? (' (skipped '+skipped+' untitled)') : ''));
  });

  importBtn.addEventListener('click', function(){ importInput.click(); });
  importInput.addEventListener('change', async function(){
    var files = Array.from(importInput.files||[]);
    if(!files.length) return;
    var count = 0;
    for(var i=0;i<files.length;i++){
      var f = files[i];
      var text = await f.text();
      var title = f.name.replace(/\.[^/.]+$/, '');
      var body = text, tags = [];
      var fmMatch = text.match(/^---\n([\s\S]*?)\n---\n?/);
      if(fmMatch){
        body = text.slice(fmMatch[0].length);
        var fm = fmMatch[1];
        var titleMatch = fm.match(/title:\s*(.+)/);
        if(titleMatch) title = titleMatch[1].trim();
        var tagsMatch = fm.match(/tags:\s*\[(.*?)\]/);
        if(tagsMatch) tags = tagsMatch[1].split(',').map(function(s){return s.trim();}).filter(Boolean);
      }
      var id = nextSeq(INDEX, '');
      var now = new Date().toISOString();
      var note = { id:id, title: title||'', folderId: CURRENT_FOLDER, graphIds: [], tags: tags, content: body.trim(), createdAt: now, updatedAt: now };
      await setNoteRaw(note);
      CACHE.set(id, note);
      INDEX.push(toIndexEntry(note));
      count++;
    }
    await setIndex(INDEX);
    broadcastChange();
    renderSidebar();
    importInput.value = '';
    toast('Imported ' + count + (count===1?' note':' notes'));
  });

  /* ============ named graphs (custom) ============ */
  function openGraphMembershipPicker(){
    var n = CACHE.get(CURRENT_ID);
    if(!n) return;
    function rows(){
      if(!GRAPHS.length) return '<li class="muted" style="cursor:default;">No named graphs yet \u2014 add one below.</li>';
      var memberSet = new Set(n.graphIds||[]);
      return GRAPHS.map(function(g){
        var checked = memberSet.has(g.id) ? 'checked' : '';
        return '<li style="cursor:default;"><label style="display:flex;align-items:center;gap:8px;width:100%;cursor:pointer;">'+
          '<input type="checkbox" data-graph="'+g.id+'" '+checked+' /> '+escapeHtml(g.name)+'</label></li>';
      }).join('');
    }
    showModal(
      '<h3>Add "'+escapeHtml(n.title||'(untitled)')+'" to a graph</h3>'+
      '<ul class="picker-list" id="graphPickList">'+rows()+'</ul>'+
      '<div class="modal-actions" style="justify-content:flex-start;margin-top:12px;">'+
      '<input type="text" id="newGraphNameInput" class="picker-input" placeholder="New graph name" style="flex:1;margin:0;" />'+
      '<button class="btn" id="createGraphInlineBtn">Add graph</button>'+
      '</div>'
    );
    document.getElementById('graphPickList').addEventListener('change', async function(e){
      var cb = e.target.closest('input[type="checkbox"][data-graph]');
      if(!cb) return;
      var gid = cb.getAttribute('data-graph');
      var set = new Set(n.graphIds||[]);
      if(cb.checked) set.add(gid); else set.delete(gid);
      n.graphIds = Array.from(set);
      n.updatedAt = new Date().toISOString();
      await setNoteRaw(n);
      var entry = INDEX.find(function(x){ return x.id===n.id; });
      if(entry){ entry.graphIds = n.graphIds; entry.updatedAt = n.updatedAt; }
      await setIndex(INDEX);
      broadcastChange();
    });
    document.getElementById('createGraphInlineBtn').addEventListener('click', async function(){
      var input = document.getElementById('newGraphNameInput');
      var name = input.value.trim();
      if(!name) return;
      var id = nextSeq(GRAPHS, 'G');
      GRAPHS.push({ id:id, name:name, createdAt:new Date().toISOString() });
      await setGraphs(GRAPHS);
      var set = new Set(n.graphIds||[]);
      set.add(id);
      n.graphIds = Array.from(set);
      n.updatedAt = new Date().toISOString();
      await setNoteRaw(n);
      var entry = INDEX.find(function(x){ return x.id===n.id; });
      if(entry){ entry.graphIds = n.graphIds; entry.updatedAt = n.updatedAt; }
      await setIndex(INDEX);
      broadcastChange();
      input.value = '';
      document.getElementById('graphPickList').innerHTML = rows();
    });
  }

  function promptGraphName(mode, graphId){
    var existing = graphId ? GRAPHS.find(function(g){return g.id===graphId;}) : null;
    showModal(
      '<h3>'+(mode==='rename'?'Rename graph':'New graph')+'</h3>'+
      '<input type="text" id="graphNameInput" class="picker-input" placeholder="Graph name" value="'+(existing?escapeHtml(existing.name):'')+'" />'+
      '<div class="modal-actions"><button class="btn" id="graphCancelBtn">Cancel</button><button class="btn btn-primary" id="graphSaveBtn">'+(mode==='rename'?'Save':'Create')+'</button></div>'
    );
    var input = document.getElementById('graphNameInput');
    setTimeout(function(){ input.focus(); input.select(); }, 0);
    document.getElementById('graphCancelBtn').addEventListener('click', hideModal);
    async function submit(){
      var name = input.value.trim();
      if(!name) return;
      if(mode==='rename'){
        var g = GRAPHS.find(function(x){return x.id===graphId;});
        if(g){ g.name = name; await setGraphs(GRAPHS); broadcastChange(); }
      } else {
        var id = nextSeq(GRAPHS,'G');
        GRAPHS.push({id:id,name:name,createdAt:new Date().toISOString()});
        await setGraphs(GRAPHS);
        broadcastChange();
        GRAPH_SCOPE_MODE = 'custom';
        GRAPH_SCOPE_ID = id;
      }
      hideModal();
      if(VIEW==='graph'){ renderGraphToolbar(); buildAndRenderGraph(); }
    }
    document.getElementById('graphSaveBtn').addEventListener('click', submit);
    input.addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); submit(); } });
  }

  function confirmDeleteGraph(id){
    var g = GRAPHS.find(function(x){return x.id===id;});
    if(!g) return;
    showModal(
      '<h3>Delete graph "'+escapeHtml(g.name)+'"?</h3>'+
      '<p>This removes the grouping only \u2014 your notes stay exactly as they are.</p>'+
      '<div class="modal-actions"><button class="btn" id="cancelDeleteGraphBtn">Cancel</button><button class="btn" id="confirmDeleteGraphBtn">Delete graph</button></div>'
    );
    document.getElementById('cancelDeleteGraphBtn').addEventListener('click', hideModal);
    document.getElementById('confirmDeleteGraphBtn').addEventListener('click', async function(){
      await deleteGraph(id);
      hideModal();
    });
  }

  async function deleteGraph(id){
    GRAPHS = GRAPHS.filter(function(g){ return g.id !== id; });
    await setGraphs(GRAPHS);
    var affected = INDEX.filter(function(e){ return (e.graphIds||[]).indexOf(id) !== -1; });
    for(var i=0;i<affected.length;i++){
      var entry = affected[i];
      var n = CACHE.get(entry.id);
      if(!n){ n = await getNoteById(entry.id); if(n) CACHE.set(entry.id,n); }
      if(n){
        n.graphIds = (n.graphIds||[]).filter(function(x){return x!==id;});
        await setNoteRaw(n);
      }
      entry.graphIds = (entry.graphIds||[]).filter(function(x){return x!==id;});
    }
    await setIndex(INDEX);
    broadcastChange();
    GRAPH_SCOPE_MODE = 'folder'; GRAPH_SCOPE_ID = null;
    if(VIEW==='graph'){ renderGraphToolbar(); buildAndRenderGraph(); }
  }

  /* ============ graph view ============ */
  function stopGraphSim(){ if(graphSim){ graphSim.stop(); graphSim = null; } }

  async function setActiveView(view){
    if(view === VIEW) view = 'notes'; /* clicking the active view's button again returns to notes */
    flushSave();
    if(VIEW === 'graph'){ graphToggleBtn.classList.remove('active'); stopGraphSim(); }
    if(VIEW === 'bible'){ bibleToggleBtn.classList.remove('active'); }
    VIEW = view;
    if(view === 'graph'){
      graphToggleBtn.classList.add('active');
      await mountGraph();
    } else if(view === 'bible'){
      bibleToggleBtn.classList.add('active');
      await mountBible();
    } else {
      if(CURRENT_ID) await openNote(CURRENT_ID); else mountEmptyState();
    }
  }
  graphToggleBtn.addEventListener('click', function(){ setActiveView('graph'); });
  bibleToggleBtn.addEventListener('click', function(){ setActiveView('bible'); });

  async function mountGraph(){
    editorPane.innerHTML =
      '<div class="graph-view">' +
      '<div class="graph-toolbar" id="graphToolbarInner"></div>' +
      '<svg id="graphSvg"></svg>' +
      '</div>';
    await ensureAllLoaded();
    renderGraphToolbar();
    buildAndRenderGraph();
  }

  function renderGraphToolbar(){
    var bar = document.getElementById('graphToolbarInner');
    if(!bar) return;
    var left = '';
    if(GRAPH_SCOPE_MODE === 'folder'){
      left = '<div class="breadcrumb" id="graphBreadcrumb"></div>';
    } else {
      var g = GRAPHS.find(function(x){ return x.id===GRAPH_SCOPE_ID; });
      left = '<div class="graph-name-label">'+escapeHtml(g?g.name:'Graph')+
        '<button class="crumb-action" data-action="rename-graph" title="Rename graph">'+PENCIL_SVG+'</button>'+
        '<button class="crumb-action" data-action="delete-graph" title="Delete graph">'+TRASH_SVG+'</button></div>';
    }
    var options = '<option value="">All notes</option>';
    GRAPHS.forEach(function(g){
      var sel = (GRAPH_SCOPE_MODE==='custom' && GRAPH_SCOPE_ID===g.id) ? ' selected' : '';
      options += '<option value="'+g.id+'"'+sel+'>'+escapeHtml(g.name)+'</option>';
    });
    options += '<option value="__new__">+ New graph\u2026</option>';

  function buildFolderGraphData(scope){
    var childFolders = FOLDERS.filter(function(f){ return f.parentId === scope; });
    var nodesById = new Map();
    childFolders.forEach(function(f){
      nodesById.set('folder:'+f.id, { id:'folder:'+f.id, refId: f.id, kind:'folder', title: f.name });
    });
    INDEX.filter(function(e){ return e.folderId === scope; }).forEach(function(e){
      nodesById.set(e.id, { id: e.id, refId: e.id, kind:'note', title: e.title || '(untitled)' });
    });

    function ancestorFolderUnderScope(folderId){
      var f = FOLDERS.find(function(x){ return x.id === folderId; });
      while(f && f.parentId !== scope){
        f = FOLDERS.find(function(x){ return x.id === f.parentId; });
      }
      return f ? f.id : null;
    }
    function visibleNodeKey(note){
      if(note.folderId === scope) return note.id;
      if(!note.folderId) return null;
      var anc = ancestorFolderUnderScope(note.folderId);
      return anc ? ('folder:'+anc) : null;
    }

    var linkMap = new Map();
    var titleMap = new Map(INDEX.map(function(e){ return [e.title.toLowerCase(), e]; }));

    INDEX.forEach(function(e){
      var srcKey = visibleNodeKey(e);
      if(!srcKey) return;
      var n = CACHE.get(e.id);
      if(!n || !n.content) return;
      var found = n.content.match(/\[\[([^\]|]+)(?:\|[^\]]+)?\]\]/g) || [];
      found.forEach(function(raw){
        var t = raw.slice(2,-2).split('|')[0].trim();
        if(!t) return;
        var targetEntry = titleMap.get(t.toLowerCase());
        var tgtKey = null;
        if(targetEntry){
          tgtKey = visibleNodeKey(targetEntry);
        } else if(srcKey === e.id){
          var pid = 'phantom:'+t.toLowerCase();
          if(!nodesById.has(pid)) nodesById.set(pid, { id: pid, refId: t, kind:'phantom', title: t });
          tgtKey = pid;
        }
        if(!tgtKey || tgtKey === srcKey) return;
        var key = srcKey+'\u2192'+tgtKey;
        if(!linkMap.has(key)) linkMap.set(key, { source: srcKey, target: tgtKey });
      });
    });

    return { nodes: Array.from(nodesById.values()), links: Array.from(linkMap.values()) };
  }

  function buildCustomGraphData(graphId){
    var members = INDEX.filter(function(e){ return (e.graphIds||[]).indexOf(graphId) !== -1; });
    var memberIds = new Set(members.map(function(e){ return e.id; }));
    var nodesById = new Map();
    members.forEach(function(e){ nodesById.set(e.id, { id:e.id, refId:e.id, kind:'note', title: e.title || '(untitled)' }); });
    var linkMap = new Map();
    members.forEach(function(e){
      var n = CACHE.get(e.id);
      if(!n || !n.content) return;
      var found = n.content.match(/\[\[([^\]|]+)(?:\|[^\]]+)?\]\]/g) || [];
      found.forEach(function(raw){
        var t = raw.slice(2,-2).split('|')[0].trim();
        if(!t) return;
        var targetEntry = INDEX.find(function(x){ return x.title.toLowerCase() === t.toLowerCase(); });
        if(!targetEntry || !memberIds.has(targetEntry.id) || targetEntry.id === e.id) return;
        var key = e.id+'\u2192'+targetEntry.id;
        if(!linkMap.has(key)) linkMap.set(key, { source: e.id, target: targetEntry.id });
      });
    });
    return { nodes: Array.from(nodesById.values()), links: Array.from(linkMap.values()) };
  }

  function buildGraphData(){

  function buildAndRenderGraph(){
    stopGraphSim();
    var svgEl = document.getElementById('graphSvg');
    if(!svgEl || typeof d3 === 'undefined') return;
    var svg = d3.select(svgEl);
    svg.selectAll('*').remove(); /* always clear the previous graph before drawing the next one */

    var rect = svgEl.getBoundingClientRect();
    var width = rect.width || 600;
    var height = rect.height || 400;
    svg.attr('viewBox', '0 0 '+width+' '+height);

    var data = buildGraphData();
    var nodes = data.nodes;
    var links = data.links;

    if(!nodes.length){
      svg.append('text')
        .attr('x', width/2).attr('y', height/2)
        .attr('text-anchor', 'middle')
        .attr('class', 'graph-empty-text')
        .text(GRAPH_SCOPE_MODE==='custom' ? 'Add notes to this graph from any note\u2019s graph icon.' : 'Create a note or folder, or link notes with [[double brackets]].');
      return;
    }

    var degree = new Map();
    nodes.forEach(function(n){ degree.set(n.id, 0); });
    links.forEach(function(l){
      degree.set(l.source, (degree.get(l.source)||0)+1);
      degree.set(l.target, (degree.get(l.target)||0)+1);
    });
    function nodeExtent(d){
      var deg = degree.get(d.id) || 0;
      if(d.kind === 'folder') return 11 + Math.min(deg,8);
      return 6 + Math.min(deg,8) * 1.4;
    }

    var container = svg.append('g');
    svg.call(d3.zoom().scaleExtent([0.2,4]).on('zoom', function(event){ container.attr('transform', event.transform); }));

    var nodesLookup = new Map(nodes.map(function(n){ return [n.id, n]; }));

    var linkSel = container.selectAll('line').data(links).enter().append('line')
      .attr('class', function(d){
        var t = nodesLookup.get(typeof d.target==='object' ? d.target.id : d.target);
        return 'graph-link' + (t && t.kind==='phantom' ? ' graph-link-phantom' : '');
      });

    var nodeGroup = container.selectAll('g.gnode').data(nodes).enter().append('g')
      .attr('class','gnode')
      .style('cursor','pointer')
      .call(d3.drag()
        .on('start', function(event,d){ if(!event.active) sim.alphaTarget(0.25).restart(); d.fx=d.x; d.fy=d.y; })
        .on('drag', function(event,d){ d.fx=event.x; d.fy=event.y; })
        .on('end', function(event,d){ if(!event.active) sim.alphaTarget(0); d.fx=null; d.fy=null; }))
      .on('click', function(event,d){
        if(d.kind==='note') switchNote(d.refId);
        else if(d.kind==='phantom') createNoteWithTitle(d.refId);
        else if(d.kind==='folder') enterFolder(d.refId);
      });

    nodeGroup.each(function(d){
      var g = d3.select(this);
      var ext = nodeExtent(d);
      if(d.kind==='folder'){
        g.append('rect').attr('x',-ext).attr('y',-ext).attr('width',ext*2).attr('height',ext*2).attr('rx',4).attr('class','graph-node-folder');
      } else if(d.kind==='phantom'){
        g.append('circle').attr('r',ext).attr('class','graph-node-phantom');
      } else {
        g.append('circle').attr('r',ext).attr('class','graph-node-real');
      }
    });

    nodeGroup.append('text')
      .attr('dy', function(d){ return -(nodeExtent(d)+6); })
      .attr('text-anchor','middle')
      .text(function(d){ return d.title; });

    var sim = d3.forceSimulation(nodes)
      .force('link', d3.forceLink(links).id(function(d){ return d.id; }).distance(75).strength(0.55))
      .force('charge', d3.forceManyBody().strength(-230))
      .force('center', d3.forceCenter(width/2, height/2))
      .force('collide', d3.forceCollide().radius(function(d){ return nodeExtent(d)+14; }));

    sim.on('tick', function(){
      linkSel
        .attr('x1', function(d){ return d.source.x; })
        .attr('y1', function(d){ return d.source.y; })
        .attr('x2', function(d){ return d.target.x; })
        .attr('y2', function(d){ return d.target.y; });
      nodeGroup.attr('transform', function(d){ return 'translate('+d.x+','+d.y+')'; });
    });

    graphSim = sim;
  }

  /* Parses API.Bible's HTML chapter content into { number, text, heading } per verse */
  function parseApiBibleHtml(html){
    var doc = new DOMParser().parseFromString(html, 'text/html');
    var verses = [];
    var pendingHeading = null;
    var currentVerse = null;
    function isHeadingEl(node){
      if(!node.classList) return false;
      return node.classList.contains('s') || node.classList.contains('s1') || node.classList.contains('s2') || node.classList.contains('ms') || node.classList.contains('mr');
    }
    function walk(node){
      if(node.nodeType === 1){
        if(node.tagName === 'SPAN' && node.classList.contains('v')){
          if(currentVerse) verses.push(currentVerse);
          currentVerse = { number: node.getAttribute('data-number') || node.textContent.trim(), text: '', heading: pendingHeading };
          pendingHeading = null;
          return;
        }
        if(isHeadingEl(node)){
          var t = node.textContent.trim();
          if(t) pendingHeading = pendingHeading ? (pendingHeading+' '+t) : t;
          return;
        }
        for(var i=0; i<node.childNodes.length; i++){ walk(node.childNodes[i]); }
        if(currentVerse && node.tagName === 'P'){ currentVerse.text += ' '; }
      } else if(node.nodeType === 3){
        if(currentVerse) currentVerse.text += node.textContent;
      }
    }
    walk(doc.body);
    if(currentVerse) verses.push(currentVerse);
    verses.forEach(function(v){ v.text = v.text.replace(/\s+/g,' ').trim(); });
    return verses;
  }

  async function loadApiBibleChapter(){
    var reader = document.getElementById('bibleReader');
    var settings = await loadBibleApiSettings();
    if(!settings.apiKey || !settings.bibleId){
      reader.innerHTML = '<p class="muted">Add your API.Bible key and Bible ID (gear icon above) to read NASB2020.</p>';
      return;
    }
    var usfm = USFM_BOOK_CODES[BIBLE_BOOK];
    if(!usfm){ reader.innerHTML = '<p class="muted">This book is not mapped for API.Bible yet.</p>'; return; }
    var chapterId = usfm + '.' + BIBLE_CHAPTER;
    try {
      var url = 'https://api.scripture.api.bible/v1/bibles/' + encodeURIComponent(settings.bibleId) + '/chapters/' + encodeURIComponent(chapterId) + '?content-type=html';
      var res = await fetch(url, { headers: { 'api-key': settings.apiKey } });
      if(!res.ok){
        reader.innerHTML = '<p class="muted">API.Bible returned an error (status '+res.status+'). Double-check the key and Bible ID in settings.</p>';
        return;
      }
      var data = await res.json();
      var chapter = data.data;
      if(!chapter || !chapter.content){
        reader.innerHTML = '<p class="muted">No content returned for this chapter.</p>';
        return;
      }
      var verses = parseApiBibleHtml(chapter.content);
      var transName = 'NASB 2020';
      var html = '<h3 class="bible-chapter-heading">'+escapeHtml(chapter.reference || (BIBLE_BOOK+' '+BIBLE_CHAPTER))+' <span class="muted">('+transName+')</span></h3>';
      verses.forEach(function(v){
        if(v.heading) html += '<p class="bible-section-heading">'+escapeHtml(v.heading)+'</p>';
        html += '<div class="bible-verse">'+
          '<span class="verse-num">'+escapeHtml(String(v.number))+'</span>'+
          '<span class="verse-text">'+escapeHtml(v.text)+'</span>'+
          '<button class="verse-insert" data-verse="'+escapeHtml(String(v.number))+'" title="Insert into note">'+PLUS_SVG+'</button>'+
          '</div>';
      });
      if(chapter.copyright){ html += '<p class="bible-copyright muted">'+escapeHtml(chapter.copyright)+'</p>'; }
      reader.innerHTML = html;
      lastChapterData = { book: BIBLE_BOOK, chapter: BIBLE_CHAPTER, translation: BIBLE_TRANSLATION, verses: verses.map(function(v){ return {verse:v.number, text:v.text}; }), transName: transName };
      reader.querySelectorAll('.verse-insert').forEach(function(btn){
        btn.addEventListener('click', function(){
          var vnum = btn.getAttribute('data-verse');
          var v = verses.find(function(x){ return String(x.number)===vnum; });
          if(v) insertVerseIntoCurrentNote(BIBLE_BOOK+' '+BIBLE_CHAPTER+':'+vnum, v.text, transName);
        });
      });
      saveBibleState();
    } catch(e){
      reader.innerHTML = '<p class="muted">Could not reach API.Bible. If this keeps happening it may be blocking direct browser requests (it is built mainly for server-side use) \u2014 tell me and I can help set up a small proxy.</p>';
    }
  }

    document.getElementById('bibleApiSettingsBtn').addEventListener('click', openBibleApiSettings);
    document.getElementById('biblePrevBtn').addEventListener('click', function(){ bibleStep(-1); });
    document.getElementById('bibleNextBtn').addEventListener('click', function(){ bibleStep(1); });
    document.getElementById('bibleJumpBtn').addEventListener('click', bibleJump);
    document.getElementById('bibleJumpInput').addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); bibleJump(); } });
    document.getElementById('bibleInsertChapterBtn').addEventListener('click', async function(){
      if(!CURRENT_ID){ toast('Open a note first, then come back to insert into it.'); return; }
      if(!lastChapterData || !lastChapterData.verses.length){ toast('Nothing loaded yet.'); return; }
      var d = lastChapterData;
      var body = d.verses.map(function(v){ return v.verse+' '+(v.text||'').trim(); }).join(' ');
      await insertVerseIntoCurrentNote(d.book+' '+d.chapter, body, d.transName);
    });
  }

  function bibleStep(delta){
    var idx = BIBLE_BOOKS.findIndex(function(b){ return b[0]===BIBLE_BOOK; });
    if(idx===-1) idx = 0;
    var count = BIBLE_BOOKS[idx][1];
    var newChapter = BIBLE_CHAPTER + delta;
    if(newChapter < 1){
      idx = Math.max(0, idx-1);
      BIBLE_BOOK = BIBLE_BOOKS[idx][0];
      BIBLE_CHAPTER = BIBLE_BOOKS[idx][1];
    } else if(newChapter > count){
      idx = Math.min(BIBLE_BOOKS.length-1, idx+1);
      BIBLE_BOOK = BIBLE_BOOKS[idx][0];
      BIBLE_CHAPTER = 1;
    } else {
      BIBLE_CHAPTER = newChapter;
    }
    populateBookSelect();
    populateChapterSelect();
    loadBibleChapter();
  }

  function bibleJump(){
    var input = document.getElementById('bibleJumpInput');
    var val = (input.value||'').trim();
    if(!val) return;
    var m = val.match(/^(.*?)(\d+)(?::(\d+))?$/);
    if(!m){ toast('Could not read that reference.'); return; }
    var bookPart = m[1].trim();
    var chapterPart = parseInt(m[2],10);
    var found = BIBLE_BOOKS.find(function(b){ return b[0].toLowerCase() === bookPart.toLowerCase(); });
    if(!found){ found = BIBLE_BOOKS.find(function(b){ return b[0].toLowerCase().indexOf(bookPart.toLowerCase()) === 0; }); }
    if(!found){ toast('Book not recognized: ' + bookPart); return; }
    BIBLE_BOOK = found[0];
    BIBLE_CHAPTER = Math.min(Math.max(1, chapterPart||1), found[1]);
    populateBookSelect();
    populateChapterSelect();
    loadBibleChapter();
    input.value = '';
  }

  async function loadBibleChapter(){
    var reader = document.getElementById('bibleReader');
    if(!reader) return;
    reader.innerHTML = '<p class="muted">Loading\u2026</p>';
    if(BIBLE_TRANSLATION === 'apibible'){
      await loadApiBibleChapter();
      return;
    }
    try {
      var ref = BIBLE_BOOK + ' ' + BIBLE_CHAPTER;
      var url = 'https://bible-api.com/' + encodeURIComponent(ref) + '?translation=' + encodeURIComponent(BIBLE_TRANSLATION);
      var res = await fetch(url);
      var data = await res.json();
      if(data.error){ reader.innerHTML = '<p class="muted">'+escapeHtml(data.error)+'</p>'; return; }
      var verses = data.verses || [];
      var transName = data.translation_name || BIBLE_TRANSLATION.toUpperCase();
      var html = '<h3 class="bible-chapter-heading">'+escapeHtml(BIBLE_BOOK)+' '+BIBLE_CHAPTER+' <span class="muted">('+escapeHtml(transName)+')</span></h3>';
      verses.forEach(function(v){
        html += '<div class="bible-verse">'+
          '<span class="verse-num">'+v.verse+'</span>'+
          '<span class="verse-text">'+escapeHtml((v.text||'').trim())+'</span>'+
          '<button class="verse-insert" data-verse="'+v.verse+'" title="Insert into note">'+PLUS_SVG+'</button>'+
          '</div>';
      });
      reader.innerHTML = html;
      lastChapterData = { book: BIBLE_BOOK, chapter: BIBLE_CHAPTER, translation: BIBLE_TRANSLATION, verses: verses, transName: transName };
      reader.querySelectorAll('.verse-insert').forEach(function(btn){
        btn.addEventListener('click', function(){
          var vnum = btn.getAttribute('data-verse');
          var v = verses.find(function(x){ return String(x.verse)===vnum; });
          if(v) insertVerseIntoCurrentNote(BIBLE_BOOK+' '+BIBLE_CHAPTER+':'+vnum, v.text, transName);
        });
      });
      saveBibleState();
    } catch(e){
      reader.innerHTML = '<p class="muted">Could not reach the Bible lookup service. Check your connection and try again.</p>';
    }
  }

  async function insertVerseIntoCurrentNote(reference, text, transName){
    if(!CURRENT_ID){ toast('Open a note first, then come back to insert into it.'); return; }
    var n = CACHE.get(CURRENT_ID);
    if(!n){ n = await getNoteById(CURRENT_ID); if(n) CACHE.set(CURRENT_ID, n); }
    if(!n) return;
    var quote = '\n\n> **'+reference+'** ('+transName+')\n> ' + (text||'').trim().split('\n').join('\n> ') + '\n';
    n.content = (n.content||'') + quote;
    n.updatedAt = new Date().toISOString();
    await setNoteRaw(n);
    var entry = INDEX.find(function(e){ return e.id===n.id; });
    if(entry) entry.updatedAt = n.updatedAt;
    await setIndex(INDEX);
    broadcastChange();
    toast('Inserted ' + reference + ' into ' + (n.title || '(untitled)'));
  }

  /* ============ seed content ============ */
  async function seedWelcomeNotes(){
    var now = new Date().toISOString();
    var n1 = {
      id: '0001', title: 'Welcome', folderId: null, graphIds: [], tags: ['start-here'],
      content: "Start typing here. It saves automatically to your browser's local database, so it will still be here next time \u2014 even if you never download it.\n\n" +
        "You can download this note any time; the file is named after its title, so give it one. Notes with no title cannot be downloaded.\n\n" +
        "Link to another note with double brackets, like [[Example note]]. Switch to Read mode to click it.\n\n" +
        "A few things worth knowing:\n\n" +
        "- Make folders from the sidebar to organize your notes. The graph view can step into a folder the same way, and shows the path you took at the top, like a shell prompt.\n" +
        "- Build named graphs from any note's graph icon, to group notes together across folders.\n" +
        "- The book icon opens a full Bible reader in this same window (public-domain translations, no setup needed). Insert any verse, or a whole chapter, straight into whichever note you had open.\n" +
        "- Open this page in more than one tab or window and they stay in sync with each other.\n\n" +
        "Delete this note whenever you are ready to start your own.",
      createdAt: now, updatedAt: now
    };
    var n2 = {
      id: '0002', title: 'Example note', folderId: null, graphIds: [], tags: ['example'],
      content: "This note exists because you followed a link from [[Welcome]]. Check the bottom of that note \u2014 it now lists this one under \"Linked from.\"",
      createdAt: now, updatedAt: now
    };
    await setNoteRaw(n1);
    await setNoteRaw(n2);
    await setIndex([toIndexEntry(n1), toIndexEntry(n2)]);
  }

  /* ============ multi-tab external change handling ============ */
  var externalChangeTimer = null;
  function handleExternalChange(){
    clearTimeout(externalChangeTimer);
    externalChangeTimer = setTimeout(applyExternalChange, 150);
  }
  if(bc){ bc.onmessage = function(){ handleExternalChange(); }; }

  async function applyExternalChange(){
    var prevUpdated = (CURRENT_ID && CACHE.has(CURRENT_ID)) ? CACHE.get(CURRENT_ID).updatedAt : null;
    INDEX = await getIndex();
    FOLDERS = await getFolders();
    GRAPHS = await getGraphs();
    var keep = CURRENT_ID;
    Array.from(CACHE.keys()).forEach(function(k){ if(k!==keep) CACHE.delete(k); });
    renderSidebar();
    if(VIEW==='graph'){ renderGraphToolbar(); buildAndRenderGraph(); }
    if(CURRENT_ID){
      var freshEntry = INDEX.find(function(e){ return e.id===CURRENT_ID; });
      if(!freshEntry){
        CURRENT_ID = null;
        mountEmptyState();
      } else if(prevUpdated && freshEntry.updatedAt !== prevUpdated){
        toast('This note changed in another window.');
      }
    }
  }

  /* ============ init ============ */
  async function init(){
    SETTINGS = await loadSettings();
    applyTheme(SETTINGS.theme);
    INDEX = await getIndex();
    FOLDERS = await getFolders();
    GRAPHS = await getGraphs();
    if(!INDEX.length){
      await seedWelcomeNotes();
      INDEX = await getIndex();
    }
    await renderSidebar();
    var sorted = INDEX.slice().sort(function(a,b){ return new Date(b.updatedAt)-new Date(a.updatedAt); });
    if(sorted[0]) await openNote(sorted[0].id);
    else mountEmptyState();
  }

  init();
})();
</script>
